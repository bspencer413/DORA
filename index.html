    --alive: #2af5a0;
    --dead: #ff3b6b;
    --txt: #eef2f8;
    --txt-2: #b8c4d6;
    --txt-3: #8a99b3;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(1100px 620px at 50% -6%, rgba(255,46,154,0.10), transparent 60%),
      radial-gradient(1000px 680px at 50% 112%, rgba(47,243,214,0.10), transparent 60%),
      var(--void);
    color: var(--txt);
    min-height: 100vh; min-height: 100dvh;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  .display { font-family: 'Anton', sans-serif; text-transform: uppercase; letter-spacing: 0.01em; }
  .tnum { font-variant-numeric: tabular-nums; }
  .panel { background: var(--panel); border: 1px solid var(--line); }
  .t2 { color: var(--txt-2); } .t3 { color: var(--txt-3); }

  /* ---- real neon-tube text ---- */
  .neon-pink  { color:#fff; text-shadow:0 0 4px #fff,0 0 11px #ff5fb4,0 0 24px #ff2e9a,0 0 46px #ff2e9a,0 0 88px #ff2e9a; }
  .neon-teal  { color:#f2fffd; text-shadow:0 0 4px #fff,0 0 11px #86f7ea,0 0 24px #2ff3d6,0 0 46px #2ff3d6,0 0 86px #2ff3d6; }
  .neon-alive { color:#f1fff8; text-shadow:0 0 4px #fff,0 0 11px #7dffc6,0 0 24px #2af5a0,0 0 46px #2af5a0,0 0 88px #2af5a0; }
  .neon-dead  { color:#fff3f6; text-shadow:0 0 4px #fff,0 0 11px #ff7d97,0 0 24px #ff3b6b,0 0 46px #ff3b6b,0 0 88px #ff3b6b; }
  .tube-pink  { border:2px solid rgba(255,46,154,0.65); box-shadow:0 0 14px rgba(255,46,154,0.5), inset 0 0 16px rgba(255,46,154,0.22); }
  .tube-teal  { border:2px solid rgba(47,243,214,0.6); box-shadow:0 0 14px rgba(47,243,214,0.45), inset 0 0 16px rgba(47,243,214,0.2); }

  .flick { animation: flick 5.5s infinite; }
  @keyframes flick {
    0%,17%,21%,23%,55%,58%,100% { opacity:1; }
    19%,22%,56% { opacity:0.35; }
  }
  .flick2 { animation: flick2 7s infinite; }
  @keyframes flick2 {
    0%,40%,43%,80%,100% { opacity:1; }
    41%,82% { opacity:0.5; }
  }

  .chip {
    background: transparent; border: 2px solid var(--dead);
    color: #ffd7e0; box-shadow: 0 0 10px rgba(255,59,107,0.35), inset 0 0 10px rgba(255,59,107,0.12);
    transition: transform .08s ease, border-color .14s ease, color .14s ease, box-shadow .14s ease;
  }
  .chip:active { transform: scale(0.96); }
  .chip-on {
    border-color: var(--alive); color: #d7ffe9;
    box-shadow: 0 0 14px rgba(42,245,160,0.5), inset 0 0 12px rgba(42,245,160,0.18);
  }
  .btn { transition: transform .06s ease, box-shadow .16s ease, filter .16s ease; }
  .btn:active { transform: scale(0.985); }
  .glow-teal { box-shadow: 0 0 30px rgba(47,243,214,0.4); }
  .glow-alive { box-shadow: 0 0 36px rgba(42,245,160,0.5); }
  .glow-dead  { box-shadow: 0 0 36px rgba(255,59,107,0.48); }

  .slam { animation: slam .44s cubic-bezier(.15,1.2,.28,1) both; }
  @keyframes slam {
    0%   { opacity: 0; transform: scale(2.2) rotate(-7deg); filter: blur(8px); }
    50%  { opacity: 1; filter: blur(0); }
    66%  { transform: scale(0.9) rotate(1.5deg); }
    82%  { transform: scale(1.04) rotate(-1deg); }
    100% { opacity: 1; transform: scale(1) rotate(-2deg); }
  }
  .flash { animation: flash .55s ease both; }
  @keyframes flash { 0% { opacity: 0.85; } 100% { opacity: 0; } }
  .rise { animation: rise .34s ease both; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(12px); } 100% { opacity: 1; transform: translateY(0); } }
  .pop { animation: pop .32s ease both; }
  @keyframes pop { 0% { opacity: 0; transform: scale(.95); } 100% { opacity: 1; transform: scale(1); } }
  .neon-frame {
    border: 2px solid rgba(255,46,154,0.55);
    border-radius: 26px;
    box-shadow: 0 0 16px rgba(255,46,154,0.45), 0 0 42px rgba(255,46,154,0.18), inset 0 0 22px rgba(255,46,154,0.14);
  }
  .btn-neon {
    background: transparent;
    border: 2px solid var(--teal);
    box-shadow: 0 0 14px rgba(47,243,214,0.5), inset 0 0 18px rgba(47,243,214,0.2);
    transition: transform .06s ease, box-shadow .16s ease;
  }
  .btn-neon:active { transform: scale(0.985); box-shadow: 0 0 26px rgba(47,243,214,0.7), inset 0 0 24px rgba(47,243,214,0.3); }
  .btn-mini { background:transparent; border:2px solid var(--teal); box-shadow:0 0 10px rgba(47,243,214,0.45), inset 0 0 12px rgba(47,243,214,0.15); transition:transform .06s ease, box-shadow .16s ease; }
  .btn-mini:active { transform:scale(.96); box-shadow:0 0 18px rgba(47,243,214,0.65); }
  .blink { animation: blink 1.4s infinite steps(1); }
  @keyframes blink { 0%,60%,100% { opacity: 1; } 70%,88% { opacity: 0.25; } }
  .ringwrap { position: relative; width: 46px; height: 46px; }
  .ringwrap svg { transform: rotate(-90deg); }
  @media (prefers-reduced-motion: reduce) { .slam,.rise,.flash,.pop,.flick,.flick2,.blink { animation: none; } }
  input { font-family: inherit; }
  ::-webkit-scrollbar { height: 0; width: 0; }
</style>

var CATEGORIES = [
  { id:'actors', label:'Actors' }, { id:'performers', label:'Performers' },
  { id:'athletes', label:'Athletes' }, { id:'politics', label:'Politicians' },
  { id:'authors', label:'Authors' }, { id:'random', label:'Random' }
];
var DECADES = ['Any','40s','50s','60s','70s','80s','90s','00s','10s','20s'];
var WIN_SCORE = 7;

function buildFlat(){
  var out=[];
  for (var cat in POOL){ if(!POOL.hasOwnProperty(cat)) continue; var arr=POOL[cat];
    for (var i=0;i<arr.length;i++){ var e=arr[i];
      out.push({ name:e[0], decade:e[1], aliveFallback:e[2], tier:e[3]?e[3]:'h', title:e[4]?e[4]:e[0], cat:cat }); } }
  return out;
}
var ALL = buildFlat();
function poolFor(sel, decade, used, diff){
  var wantRandom = sel.indexOf('random')!==-1;
  return ALL.filter(function(p){
    if (used[p.title]) return false;
    if (decade!=='Any' && p.decade!==decade) return false;
    if (diff && diff!=='both' && p.tier!==diff) return false;
    if (wantRandom) return true;
    return sel.indexOf(p.cat)!==-1;
  });
}
function pickRandom(list){ if(!list.length) return null; return list[Math.floor(Math.random()*list.length)]; }
function catLabel(id){ for(var i=0;i<CATEGORIES.length;i++) if(CATEGORIES[i].id===id) return CATEGORIES[i].label; return ''; }

function verifyAlive(title){
  var url='https://en.wikipedia.org/w/api.php?action=query&prop=categories&cllimit=500&clshow=!hidden&redirects=1&format=json&origin=*&titles='+encodeURIComponent(title);
  return fetch(url).then(function(r){return r.json();}).then(function(data){
    var cats=[];
    try{ var pages=data.query.pages; for(var k in pages) if(pages.hasOwnProperty(k)&&pages[k].categories) cats=pages[k].categories.map(function(c){return c.title;}); }catch(e){cats=[];}
    var living=false, year=null, born=null;
    for(var i=0;i<cats.length;i++){
      if(cats[i].indexOf('Living people')!==-1) living=true;
      var m=cats[i].match(/Category:(\d{4}) deaths/); if(m) year=m[1];
      var b=cats[i].match(/Category:(\d{4}) births/); if(b) born=b[1];
    }
    if(year) return {alive:false, year:year, born:born};
    if(living) return {alive:true, year:null, born:born};
    return {alive:null, year:null, born:born};
  }).catch(function(){ return {alive:null, year:null}; });
}

function App(){
  var sc=useState('splash'), screen=sc[0], setScreen=sc[1];
  var pl=useState(['','']), players=pl[0], setPlayers=pl[1];
  var ct=useState([]), cats=ct[0], setCats=ct[1];
  var dc=useState('Any'), decade=dc[0], setDecade=dc[1];
  var tm=useState(0), timerSec=tm[0], setTimerSec=tm[1];
  var scS=useState([]), scores=scS[0], setScores=scS[1];
  var tn=useState(0), turn=tn[0], setTurn=tn[1];
  var us=useState({}), used=us[0], setUsed=us[1];
  var cu=useState(null), current=cu[0], setCurrent=cu[1];
  var rv=useState(null), reveal=rv[0], setReveal=rv[1];
  var bs=useState(false), busy=bs[0], setBusy=bs[1];
  var wnr=useState(-1), winner=wnr[0], setWinner=wnr[1];
  var lf=useState(0), left=lf[0], setLeft=lf[1];
  var so=useState(false), solo=so[0], setSolo=so[1];
  var df=useState('both'), diff=df[0], setDiff=df[1];
  var st=useState(0), streak=st[0], setStreak=st[1];
  var bt=useState(0), best=bt[0], setBest=bt[1];
  var tickRef=useRef(null);

  var validPlayers=players.filter(function(p){return p.trim().length>0;});
  var canStart=(solo ? validPlayers.length>=1 : validPlayers.length>=2) && cats.length>=1;

  function toggleCat(id){ if(cats.indexOf(id)!==-1) setCats(cats.filter(function(c){return c!==id;})); else setCats(cats.concat([id])); }
  function setPlayerName(i,v){ var n=players.slice(); n[i]=v; setPlayers(n); }
  function addPlayer(){ if(players.length<6) setPlayers(players.concat([''])); }
  function removePlayer(i){ if(players.length>2) setPlayers(players.filter(function(_,idx){return idx!==i;})); }

  function startGame(){ var s=validPlayers.map(function(n){return {name:n.trim(),score:0};});
    if(solo && s.length===0) s=[{name:'You',score:0}];
    setScores(s); setTurn(0); setUsed({}); setCurrent(null); setReveal(null); setWinner(-1);
    setStreak(0); setBest(0); setScreen('play'); serveNext(0,{}); }
  function serveNext(nextTurn, usedMap){
    var pool=poolFor(cats, decade, usedMap, diff);
    if(!pool.length){ usedMap={}; pool=poolFor(cats, decade, usedMap, diff); setUsed({}); }
    setCurrent(pickRandom(pool)); setReveal(null); setTurn(nextTurn); startTimer();
  }
  function startTimer(){ clearTimer(); if(!timerSec){ setLeft(0); return; } setLeft(timerSec); }
  function clearTimer(){ if(tickRef.current){ clearInterval(tickRef.current); tickRef.current=null; } }

  useEffect(function(){
    if(screen!=='play'||!timerSec||reveal||busy||!current){ clearTimer(); return; }
    clearTimer();
    tickRef.current=setInterval(function(){ setLeft(function(prev){ if(prev<=1){ clearTimer(); submitGuess(null,true); return 0; } return prev-1; }); },1000);
    return clearTimer;
  },[screen,timerSec,reveal,busy,current]);

  function submitGuess(guessAlive, timedOut){
    if(busy||reveal||!current) return;
    setBusy(true); clearTimer();
    verifyAlive(current.title).then(function(res){
      var truthAlive=res.alive, unknown=false;
      if(truthAlive===null){ truthAlive=current.aliveFallback; unknown=true; }
      var correct=false;
      if(!timedOut && guessAlive!==null) correct=(guessAlive===truthAlive);
      setReveal({ guess:guessAlive, truthAlive:truthAlive, year:res.year, born:res.born, correct:correct, timedOut:!!timedOut, unknown:unknown });
      setBusy(false);
    });
  }
  function scoreAndAdvance(){
    var used2=Object.assign({},used); if(current) used2[current.title]=true; setUsed(used2);
    if(solo){
      if(reveal&&reveal.correct){ var ns=streak+1; setStreak(ns); if(ns>best) setBest(ns); }
      else { setStreak(0); }
      serveNext(0, used2); return;
    }
    var newScores=scores.map(function(s,i){ if(i===turn&&reveal&&reveal.correct) return Object.assign({},s,{score:s.score+1}); return s; });
    setScores(newScores);
    var nextTurn=(turn+1)%scores.length;
    // Decide a winner only at the END of a complete round, so every player gets
    // equal turns. If the top score is tied, play another full round (sudden death).
    if(nextTurn===0){
      var maxScore=0; for(var i=0;i<newScores.length;i++) if(newScores[i].score>maxScore) maxScore=newScores[i].score;
      if(maxScore>=WIN_SCORE){
        var leaders=[]; for(var j=0;j<newScores.length;j++) if(newScores[j].score===maxScore) leaders.push(j);
        if(leaders.length===1){ setWinner(leaders[0]); setScreen('win'); setReveal(null); return; }
        // tie at the top -> keep playing; next complete round can break it
      }
    }
    serveNext(nextTurn, used2);
  }
  function newGame(){ setScreen('splash'); setReveal(null); setCurrent(null); setWinner(-1); }
  function playAgain(){ var s=scores.map(function(x){return {name:x.name,score:0};}); setScores(s); setUsed({}); setWinner(-1); setStreak(0); setBest(0); setScreen('play'); serveNext(0,{}); }

  function doShare(){
    var url='https://dora.watch';
    var data={ title:'DORA \u2014 Dead or Alive', text:'Dead or Alive? Call it. Play free:', url:url };
    if(navigator.share){ navigator.share(data).catch(function(){}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(url).then(function(){ alert('Link copied: '+url); }).catch(function(){ prompt('Copy this link:', url); }); }
    else { prompt('Copy this link:', url); }
  }
  if(screen==='info') return <Info onBack={function(){ setScreen('splash'); }} onShare={doShare} />;
  if(screen==='splash') return <Splash onPlay={function(){ setScreen('setup'); }} onShare={doShare} onInfo={function(){ setScreen('info'); }} />;
  if(screen==='setup') return <Setup players={players} setPlayerName={setPlayerName} addPlayer={addPlayer} removePlayer={removePlayer}
    cats={cats} toggleCat={toggleCat} decade={decade} setDecade={setDecade} timerSec={timerSec} setTimerSec={setTimerSec} canStart={canStart} onStart={startGame} onQuit={function(){setScreen('splash');}} solo={solo} setSolo={setSolo} diff={diff} setDiff={setDiff} />;
  if(screen==='win') return <Win winnerName={scores[winner]?scores[winner].name:''} scores={scores} onAgain={playAgain} onNew={newGame} onQuit={newGame} />;
  return <Play scores={scores} turn={turn} current={current} reveal={reveal} busy={busy} timerSec={timerSec} left={left}
    onGuess={submitGuess} onNext={scoreAndAdvance} onQuit={newGame} solo={solo} streak={streak} best={best} />;
}

        <div className="flex flex-wrap gap-2">
          {DECADES.map(function(d){ var on=props.decade===d; return (
            <button key={d} onClick={function(){props.setDecade(d);}} className={'chip rounded-full px-4 py-2 text-sm font-semibold '+(on?'chip-on':'')}>{d}</button>
          );})}
        </div>
      </Section>
      <Section label="Difficulty" hint="hard = famous, harder = deep cuts">
        <div className="flex gap-2">
          {[['both','Both'],['h','Hard'],['hh','Harder']].map(function(t){ var on=props.diff===t[0]; return (
            <button key={t[0]} onClick={function(){props.setDiff(t[0]);}} className={'chip rounded-xl flex-1 py-2.5 text-sm font-semibold '+(on?'chip-on':'')}>{t[1]}</button>
          );})}
        </div>
      </Section>
      <Section label="Answer timer" hint="optional">
        <div className="flex gap-2">
          {[[0,'Off'],[15,'15s'],[30,'30s']].map(function(t){ var on=props.timerSec===t[0]; return (
            <button key={t[0]} onClick={function(){props.setTimerSec(t[0]);}} className={'chip rounded-xl flex-1 py-2.5 text-sm font-semibold '+(on?'chip-on':'')}>{t[1]}</button>
          );})}
        </div>
      </Section>
      {!props.canStart && <p className="text-center t2 text-lg mt-3 mb-1">{props.solo?'Pick a category to start.':'Add 2+ players and pick a category.'}</p>}
      <button disabled={!props.canStart} onClick={props.onStart} className="btn-mini display w-full rounded-2xl py-3 mt-3 text-3xl neon-teal"
        style={props.canStart?{}:{opacity:0.45}}>Start</button>
      <div className="text-center mt-2">
        <button onClick={props.onQuit} className="btn-mini display rounded-xl px-8 py-2 text-base neon-teal">Quit</button>
      </div>
    </div>
  );
}
function Section(props){ return (
  <div className="mb-6">
    <div className="text-xs uppercase tracking-[0.2em] t3 mb-2 font-semibold">
      {props.label}{props.hint && <span className="t3 opacity-70"> &mdash; {props.hint}</span>}
    </div>
    {props.children}
  </div>
); }

function Play(props){
  var s=props.scores||[], cur=props.current, rev=props.reveal;
  var me=s[props.turn]?s[props.turn].name:'';
  return (
    <div className="max-w-md mx-auto px-5 py-6 flex flex-col" style={{minHeight:'100dvh', paddingTop:'max(1.5rem, env(safe-area-inset-top))'}}>
      {props.solo
        ? <div className="flex items-center justify-center gap-4 pb-1 mb-3">
            <div className="panel rounded-2xl px-6 py-3 glow-teal text-center" style={{borderColor:'var(--teal)'}}>
              <div className="text-sm t2">Streak</div>
              <div className="display text-5xl tnum leading-none" style={{color:'var(--teal)'}}>{props.streak}</div>
            </div>
            <div className="panel rounded-2xl px-6 py-3 text-center">
              <div className="text-sm t2">Best</div>
              <div className="display text-5xl tnum leading-none" style={{color:'#c3cede'}}>{props.best}</div>
            </div>
          </div>
        : <div className="flex items-center justify-center flex-wrap gap-3 pb-1 mb-3">
            {s.map(function(p,i){ var active=i===props.turn; return (
              <div key={i} className={'panel rounded-2xl px-6 py-4 '+(active?'glow-teal':'opacity-60')} style={active?{borderColor:'var(--teal)'}:{}}>
                <div className="text-base t2 max-w-[128px] truncate text-center">{p.name}</div>
                <div className="display text-5xl tnum leading-none text-center" style={{color:active?'var(--teal)':'#c3cede'}}>{p.score}<span className="t3 text-xl">/{WIN_SCORE}</span></div>
              </div>
            );})}
          </div>}
      <div className="flex-1 flex flex-col justify-center">
        {!rev && cur &&
          <div className="text-center">
            <div className="t2 text-xl mb-2 rise">{props.solo?'Your call':me+', your call'}</div>
            <div className="text-sm uppercase tracking-[0.25em] mb-8 rise neon-teal">{catLabel(cur.cat)}{cur.decade==='Any'?'':' \u00b7 '+cur.decade}</div>
            <div className="pop panel rounded-3xl px-6 py-14 mb-3" style={{background:'linear-gradient(180deg, #161d2c, #0b1018)'}}>
              <div className="display text-6xl leading-tight text-white">{cur.name}</div>
            </div>
            <div className="t3 text-sm mb-7">Dead or alive?</div>
            {props.timerSec>0 && !props.busy && <div className="flex justify-center mb-6"><TimerRing total={props.timerSec} left={props.left} /></div>}
            {props.busy
              ? <div className="t2 py-5 rise">Checking the record&hellip;</div>
              : <div className="grid grid-cols-2 gap-3">
                  <button onClick={function(){props.onGuess(false,false);}} className="btn display rounded-2xl py-8 text-4xl glow-dead" style={{background:'var(--dead)', color:'#fff'}}>Dead</button>
                  <button onClick={function(){props.onGuess(true,false);}} className="btn display rounded-2xl py-8 text-4xl glow-alive" style={{background:'var(--alive)', color:'#03150e'}}>Alive</button>
                </div>}
          </div>}
        {rev && cur && <Reveal name={cur.name} rev={rev} playerName={me} onNext={props.onNext} />}
      </div>
      <div className="text-center pt-4 pb-2">
        <button onClick={props.onQuit} className="btn-mini display rounded-xl px-6 py-2 text-lg neon-teal">Quit</button>
      </div>
    </div>
  );
}
function TimerRing(props){
  var r=19, c=2*Math.PI*r, frac=props.total?props.left/props.total:0, dash=c*frac;
  var col=props.left<=5?'var(--dead)':'var(--teal)';
  return (
    <div className="ringwrap">
      <svg width="46" height="46">
        <circle cx="23" cy="23" r={r} stroke="var(--line)" strokeWidth="4" fill="none" />
        <circle cx="23" cy="23" r={r} stroke={col} strokeWidth="4" fill="none" strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c-dash} />
      </svg>
      <div className="absolute inset-0 flex items-center justify-center tnum text-sm font-bold" style={{color:col}}>{props.left}</div>
    </div>
  );
}
function Reveal(props){
  var rev=props.rev, alive=rev.truthAlive;
  var neon=alive?'neon-alive':'neon-dead', flashCol=alive?'var(--alive)':'var(--dead)', verdict=alive?'Alive':'Dead';
  var sub;
  if(alive){
    if(rev.born){ var age=(new Date()).getFullYear()-parseInt(rev.born,10); sub='Alive \u00b7 born '+rev.born+' (age '+age+')'; }
    else sub='Alive';
  } else {
    if(rev.year && rev.born){ var da=parseInt(rev.year,10)-parseInt(rev.born,10); sub='Died '+rev.year+' (age '+da+')'; }
    else sub = rev.year?('Died '+rev.year):'Gone';
  }
  var outcome, oNeon;
  if(rev.timedOut){ outcome='Time\u2019s up'; oNeon='neon-dead'; }
  else if(rev.correct){ outcome='Nailed it'; oNeon='neon-alive'; }
  else { outcome='Missed'; oNeon='neon-dead'; }
  return (
    <div className="text-center">
      <div className="relative panel rounded-3xl px-6 py-14 mb-5 overflow-hidden">
        <div className="flash absolute inset-0" style={{background:flashCol}}></div>
        <div className="relative">
          <div className="t2 text-sm mb-4">{props.name}</div>
          <div className={'slam display leading-none '+neon} style={{fontSize:'clamp(72px, 24vw, 150px)'}}>{verdict}</div>
          <div className="t2 text-lg mt-3">{sub}</div>
          {rev.unknown && <div className="t3 text-xs mt-3">Wikipedia didn&rsquo;t confirm &mdash; using our record.</div>}
        </div>
      </div>
      <div className={'display text-4xl mb-1 '+oNeon}>{outcome}</div>
      <div className="t2 text-sm mb-7">{rev.timedOut?props.playerName+' ran out the clock':(rev.correct?'+1 for '+props.playerName:'No point for '+props.playerName)}</div>
      <button onClick={props.onNext} className="btn-mini display w-full rounded-2xl py-4 text-3xl neon-teal">Next</button>
    </div>
  );
}
function Win(props){
  var sorted=props.scores.slice().sort(function(a,b){return b.score-a.score;});
  return (
    <div className="max-w-md mx-auto px-5 py-10 flex flex-col justify-center" style={{minHeight:'100dvh'}}>
      <div className="text-center rise">
        <div className="slam display leading-[0.9] neon-teal" style={{fontSize:'clamp(72px, 24vw, 170px)'}}>{props.winnerName}</div>
        <div className="display neon-pink mt-1 mb-9" style={{fontSize:'clamp(64px, 22vw, 150px)'}}>WINS!</div>
        <div className="panel rounded-2xl divide-y" style={{borderColor:'var(--line)'}}>
          {sorted.map(function(p,i){ return (
            <div key={i} className="flex items-center justify-between px-5 py-3" style={{borderColor:'var(--line)'}}>
              <span className="t2">{p.name}</span>
              <span className="display text-2xl tnum" style={{color:i===0?'var(--teal)':'#8595ad'}}>{p.score}</span>
            </div>
          );})}
        </div>
        <button onClick={props.onAgain} className="btn-mini display w-full rounded-2xl py-4 text-3xl neon-teal mt-6">Play again</button>
        <button onClick={props.onNew} className="btn-mini display rounded-2xl w-full py-3 mt-3 text-lg neon-teal">New game</button>
        <button onClick={props.onQuit} className="btn-mini display rounded-2xl w-full py-3 mt-3 text-lg neon-teal">Quit</button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
