<!-- DORA v2.0.0 | 2026-08-03 | Dead or Alive party game — frontend-only, Wikipedia-verified. Round-robin, first to 7. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DORA — Dead or Alive</title>
<meta name="description" content="Dead or Alive: the party game. Name a star, guess living or gone, first to 7 wins. Verified live from Wikipedia.">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0f1a;
    --panel: #111a2b;
    --panel-2: #16233b;
    --teal: #2dd4bf;
    --teal-deep: #0d9488;
    --alive: #34d399;
    --dead: #fb7185;
    --slate: #64748b;
    --line: #24344f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #16233b 0%, rgba(22,35,59,0) 60%),
      var(--ink);
    color: #eef2f8;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .display { font-family: 'Anton', sans-serif; letter-spacing: 0.01em; text-transform: uppercase; }
  .tnum { font-variant-numeric: tabular-nums; }
  .card { background: var(--panel); border: 1px solid var(--line); }
  .chip {
    border: 1px solid var(--line); background: var(--panel-2);
    transition: transform .08s ease, border-color .12s ease, background .12s ease;
  }
  .chip:active { transform: scale(0.97); }
  .chip-on { background: rgba(45,212,191,0.14); border-color: var(--teal); color: #baf7ee; }
  .bigbtn { transition: transform .06s ease, filter .12s ease; }
  .bigbtn:active { transform: scale(0.98); }
  .stamp {
    animation: stampIn .34s cubic-bezier(.2,1.3,.4,1) both;
  }
  @keyframes stampIn {
    0% { opacity: 0; transform: scale(1.6) rotate(-8deg); }
    60% { opacity: 1; }
    100% { opacity: 1; transform: scale(1) rotate(-3deg); }
  }
  .rise { animation: rise .3s ease both; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
  .ringwrap { position: relative; width: 44px; height: 44px; }
  .ringwrap svg { transform: rotate(-90deg); }
  @media (prefers-reduced-motion: reduce) {
    .stamp, .rise { animation: none; }
  }
  .tap { -webkit-tap-highlight-color: transparent; }
  input { font-family: inherit; }
</style>
</head>
<body>
<div id="root" class="tap"></div>

<script type="text/babel">
'use strict';
var APP_VERSION = '2.0.0';
var useState = React.useState;
var useEffect = React.useEffect;
var useRef = React.useRef;

// ============================================================================
// NAME POOL — curated, decade-tagged. Format per entry: [name, decade, aliveFallback, wikiTitle?]
//   decade      = era they're best known for (the decade filter narrows on this)
//   aliveFallback = best-guess used ONLY if the live Wikipedia check fails
//   wikiTitle   = optional, when the exact Wikipedia page title differs from name
// Wikipedia is the source of truth at play time (stays current as people pass).
// To expand: just add lines to any category array below.
// ============================================================================
var POOL = {
  movies: [
    ['Tom Cruise','80s',true], ['Meryl Streep','80s',true], ['Marlon Brando','50s',false],
    ['Audrey Hepburn','50s',false], ['Robert De Niro','70s',true], ['Al Pacino','70s',true],
    ['Elizabeth Taylor','50s',false], ['James Dean','50s',false], ['Clint Eastwood','60s',true],
    ['Paul Newman','60s',false], ['Jack Nicholson','70s',true], ['Sidney Poitier','60s',false],
    ['Julia Roberts','90s',true], ['Denzel Washington','90s',true], ['Leonardo DiCaprio','90s',true],
    ['Humphrey Bogart','40s',false], ['Katharine Hepburn','40s',false], ['Grace Kelly','50s',false],
    ['Sean Connery','60s',false], ['Harrison Ford','80s',true], ['Bette Davis','40s',false],
    ['Steve McQueen','60s',false,'Steve McQueen (actor)'], ['Bruce Willis','90s',true],
    ['Sandra Bullock','90s',true], ['Will Smith','90s',true], ['Cary Grant','40s',false],
    ['Ingrid Bergman','40s',false], ['Robin Williams','90s',false], ['Morgan Freeman','90s',true],
    ['Sophia Loren','60s',true], ['Gene Hackman','70s',false], ['Betty White','50s',false]
  ],
  music: [
    ['Mick Jagger','60s',true], ['Keith Richards','60s',true], ['David Bowie','70s',false],
    ['John Lennon','60s',false], ['Paul McCartney','60s',true], ['Elvis Presley','50s',false],
    ['Prince','80s',false,'Prince (musician)'], ['Freddie Mercury','70s',false], ['Bob Dylan','60s',true],
    ['Jimi Hendrix','60s',false], ['Janis Joplin','60s',false], ['Bruce Springsteen','70s',true],
    ['Kurt Cobain','90s',false], ['Tom Petty','70s',false], ['Eddie Van Halen','80s',false],
    ['Ringo Starr','60s',true], ['George Harrison','60s',false], ['Chuck Berry','50s',false],
    ['Little Richard','50s',false], ['Buddy Holly','50s',false], ['Eric Clapton','60s',true],
    ['Ozzy Osbourne','70s',false], ['Stevie Nicks','70s',true], ['Madonna','80s',true],
    ['Phil Collins','80s',true], ['Tina Turner','80s',false], ['Grace Slick','60s',true],
    ['Neil Young','70s',true], ['Jerry Garcia','70s',false]
  ],
  singers: [
    ['Aretha Franklin','60s',false], ['Frank Sinatra','50s',false], ['Tony Bennett','50s',false],
    ['Diana Ross','60s',true], ['Stevie Wonder','70s',true], ['Whitney Houston','80s',false],
    ['Michael Jackson','80s',false], ['Barbra Streisand','60s',true], ['Ray Charles','50s',false],
    ['Nat King Cole','50s',false], ['Dolly Parton','70s',true], ['Willie Nelson','70s',true],
    ['Johnny Cash','60s',false], ['Cher','70s',true], ['Elton John','70s',true],
    ['Adele','00s',true], ['Beyonce','00s',true,'Beyonc\u00e9'], ['Amy Winehouse','00s',false],
    ['Luciano Pavarotti','90s',false], ['Patsy Cline','50s',false], ['Sam Cooke','60s',false],
    ['Marvin Gaye','70s',false], ['Gladys Knight','70s',true], ['Smokey Robinson','60s',true],
    ['Lionel Richie','80s',true], ['Andrea Bocelli','90s',true], ['Harry Belafonte','50s',false]
  ],
  politics: [
    ['Jimmy Carter','70s',false], ['Bill Clinton','90s',true], ['George W. Bush','00s',true],
    ['Barack Obama','00s',true], ['Ronald Reagan','80s',false], ['Richard Nixon','70s',false],
    ['Gerald Ford','70s',false], ['Margaret Thatcher','80s',false], ['Nelson Mandela','90s',false],
    ['Mikhail Gorbachev','80s',false], ['Henry Kissinger','70s',false], ['Colin Powell','90s',false],
    ['John McCain','00s',false], ['Ted Kennedy','70s',false], ['George H. W. Bush','90s',false],
    ['Elizabeth II','50s',false], ['Prince Philip, Duke of Edinburgh','50s',false],
    ['Al Gore','90s',true], ['Newt Gingrich','90s',true], ['Madeleine Albright','90s',false],
    ['Tony Blair','90s',true], ['Angela Merkel','00s',true], ['Fidel Castro','60s',false],
    ['Yasser Arafat','70s',false], ['Boris Yeltsin','90s',false], ['Dick Cheney','00s',true],
    ['Jesse Jackson','80s',true], ['Bob Dole','90s',false]
  ],
  sports: [
    ['Muhammad Ali','60s',false], ['Michael Jordan','90s',true], ['Wayne Gretzky','80s',true],
    ['Pele','60s',false,'Pel\u00e9'], ['Kobe Bryant','00s',false], ['Magic Johnson','80s',true],
    ['Larry Bird','80s',true], ['Joe Montana','80s',true], ['Jackie Robinson','40s',false],
    ['Jack Nicklaus','70s',true], ['Arnold Palmer','60s',false], ['Billie Jean King','70s',true],
    ['Serena Williams','00s',true], ['Tiger Woods','90s',true], ['Joe DiMaggio','40s',false],
    ['Mickey Mantle','50s',false], ['Hank Aaron','60s',false], ['Willie Mays','50s',false],
    ['Kareem Abdul-Jabbar','70s',true], ['Bill Russell','60s',false], ['Wilt Chamberlain','60s',false],
    ['Mike Tyson','80s',true], ['Joe Frazier','70s',false], ['George Foreman','70s',false],
    ['Diego Maradona','80s',false], ['Bo Jackson','80s',true], ['John Madden','70s',false],
    ['Nadia Comaneci','70s',true,'Nadia Com\u0103neci']
  ]
};

var CATEGORIES = [
  { id: 'movies',  label: 'Movie Stars' },
  { id: 'music',   label: 'Artists' },
  { id: 'singers', label: 'Singers' },
  { id: 'politics',label: 'Politicians' },
  { id: 'sports',  label: 'Sports Players' },
  { id: 'random',  label: 'Random' }
];

var DECADES = ['Any','40s','50s','60s','70s','80s','90s','00s'];
var WIN_SCORE = 7;

// Build a flat list of {name, title, cat, decade, aliveFallback}
function buildFlat() {
  var out = [];
  for (var cat in POOL) {
    if (!POOL.hasOwnProperty(cat)) continue;
    var arr = POOL[cat];
    for (var i = 0; i < arr.length; i++) {
      var e = arr[i];
      out.push({
        name: e[0],
        decade: e[1],
        aliveFallback: e[2],
        title: e[3] ? e[3] : e[0],
        cat: cat
      });
    }
  }
  return out;
}
var ALL = buildFlat();

// Filter the pool by selected categories + decade, excluding used titles.
function poolFor(selectedCats, decade, usedTitles) {
  var wantRandom = selectedCats.indexOf('random') !== -1;
  return ALL.filter(function(p) {
    if (usedTitles[p.title]) return false;
    if (decade !== 'Any' && p.decade !== decade) return false;
    if (wantRandom) return true;
    return selectedCats.indexOf(p.cat) !== -1;
  });
}

function pickRandom(list) {
  if (!list.length) return null;
  return list[Math.floor(Math.random() * list.length)];
}

// ---- Wikipedia verification -------------------------------------------------
// Uses the categories API. 'Living people' => alive. 'YYYY deaths' => dead + year.
// Returns a promise of { alive: bool|null, year: string|null }.
function verifyAlive(title) {
  var url = 'https://en.wikipedia.org/w/api.php'
    + '?action=query&prop=categories&cllimit=500&clshow=!hidden'
    + '&redirects=1&format=json&origin=*&titles=' + encodeURIComponent(title);
  return fetch(url).then(function(r) { return r.json(); }).then(function(data) {
    var cats = [];
    try {
      var pages = data.query.pages;
      for (var k in pages) {
        if (pages.hasOwnProperty(k) && pages[k].categories) {
          cats = pages[k].categories.map(function(c) { return c.title; });
        }
      }
    } catch (e) { cats = []; }
    var living = false, deathYear = null;
    for (var i = 0; i < cats.length; i++) {
      if (cats[i].indexOf('Living people') !== -1) living = true;
      var m = cats[i].match(/Category:(\d{4}) deaths/);
      if (m) deathYear = m[1];
    }
    if (deathYear) return { alive: false, year: deathYear };
    if (living) return { alive: true, year: null };
    return { alive: null, year: null };
  }).catch(function() { return { alive: null, year: null }; });
}

// ============================================================================
// UI
// ============================================================================
function App() {
  var screenState = useState('setup'); var screen = screenState[0], setScreen = screenState[1];

  // setup config
  var playersState = useState(['', '']); var players = playersState[0], setPlayers = playersState[1];
  var catsState = useState(['movies','music','singers','politics','sports']); var cats = catsState[0], setCats = catsState[1];
  var decadeState = useState('Any'); var decade = decadeState[0], setDecade = decadeState[1];
  var timerState = useState(0); var timerSec = timerState[0], setTimerSec = timerState[1]; // 0 = off

  // game state
  var scoresState = useState([]); var scores = scoresState[0], setScores = scoresState[1];
  var turnState = useState(0); var turn = turnState[0], setTurn = turnState[1];
  var usedState = useState({}); var used = usedState[0], setUsed = usedState[1];
  var currentState = useState(null); var current = currentState[0], setCurrent = currentState[1];
  var revealState = useState(null); var reveal = revealState[0], setReveal = revealState[1]; // {guess, truth, year, correct, unknown}
  var busyState = useState(false); var busy = busyState[0], setBusy = busyState[1];
  var winnerState = useState(-1); var winner = winnerState[0], setWinner = winnerState[1];
  var leftState = useState(0); var left = leftState[0], setLeft = leftState[1]; // timer countdown
  var tickRef = useRef(null);

  var validPlayers = players.filter(function(p) { return p.trim().length > 0; });
  var canStart = validPlayers.length >= 2 && cats.length >= 1;

  function toggleCat(id) {
    if (cats.indexOf(id) !== -1) setCats(cats.filter(function(c) { return c !== id; }));
    else setCats(cats.concat([id]));
  }
  function setPlayerName(i, val) {
    var next = players.slice();
    next[i] = val;
    setPlayers(next);
  }
  function addPlayer() { if (players.length < 6) setPlayers(players.concat([''])); }
  function removePlayer(i) { if (players.length > 2) setPlayers(players.filter(function(_, idx) { return idx !== i; })); }

  function startGame() {
    var names = validPlayers;
    var s = names.map(function(n) { return { name: n.trim(), score: 0 }; });
    setScores(s);
    setTurn(0);
    setUsed({});
    setCurrent(null);
    setReveal(null);
    setWinner(-1);
    setScreen('play');
    serveNext(0, {});
  }

  function serveNext(nextTurn, usedMap) {
    var pool = poolFor(cats, decade, usedMap);
    if (!pool.length) {
      // exhausted — allow repeats by resetting used
      usedMap = {};
      pool = poolFor(cats, decade, usedMap);
      setUsed({});
    }
    var pick = pickRandom(pool);
    setCurrent(pick);
    setReveal(null);
    setTurn(nextTurn);
    startTimer();
  }

  function startTimer() {
    clearTimer();
    if (!timerSec) { setLeft(0); return; }
    setLeft(timerSec);
  }
  function clearTimer() {
    if (tickRef.current) { clearInterval(tickRef.current); tickRef.current = null; }
  }

  // countdown driver
  useEffect(function() {
    if (screen !== 'play' || !timerSec || reveal || busy || !current) { clearTimer(); return; }
    clearTimer();
    tickRef.current = setInterval(function() {
      setLeft(function(prev) {
        if (prev <= 1) {
          clearTimer();
          // time out => auto-wrong (guess null)
          submitGuess(null, true);
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return clearTimer;
  }, [screen, timerSec, reveal, busy, current]);

  function submitGuess(guessAlive, timedOut) {
    if (busy || reveal || !current) return;
    setBusy(true);
    clearTimer();
    verifyAlive(current.title).then(function(res) {
      var truthAlive = res.alive;
      var unknown = false;
      if (truthAlive === null) { truthAlive = current.aliveFallback; unknown = true; }
      var correct = false;
      if (!timedOut && guessAlive !== null) correct = (guessAlive === truthAlive);
      setReveal({
        guess: guessAlive,
        truthAlive: truthAlive,
        year: res.year,
        correct: correct,
        timedOut: !!timedOut,
        unknown: unknown
      });
      setBusy(false);
    });
  }

  function scoreAndAdvance() {
    var newScores = scores.map(function(s, i) {
      if (i === turn && reveal && reveal.correct) return Object.assign({}, s, { score: s.score + 1 });
      return s;
    });
    setScores(newScores);
    var used2 = Object.assign({}, used);
    if (current) used2[current.title] = true;
    setUsed(used2);

    // win check
    if (reveal && reveal.correct && newScores[turn].score >= WIN_SCORE) {
      setWinner(turn);
      setScreen('win');
      setReveal(null);
      return;
    }
    var nextTurn = (turn + 1) % scores.length;
    serveNext(nextTurn, used2);
  }

  function newGame() {
    setScreen('setup');
    setReveal(null);
    setCurrent(null);
    setWinner(-1);
  }
  function playAgain() {
    var s = scores.map(function(x) { return { name: x.name, score: 0 }; });
    setScores(s);
    setUsed({});
    setWinner(-1);
    setScreen('play');
    serveNext(0, {});
  }

  // ---- render ----
  if (screen === 'setup') return <Setup
    players={players} setPlayerName={setPlayerName} addPlayer={addPlayer} removePlayer={removePlayer}
    cats={cats} toggleCat={toggleCat} decade={decade} setDecade={setDecade}
    timerSec={timerSec} setTimerSec={setTimerSec} canStart={canStart} onStart={startGame} />;

  if (screen === 'win') return <Win winnerName={scores[winner] ? scores[winner].name : ''}
    scores={scores} onAgain={playAgain} onNew={newGame} />;

  return <Play
    scores={scores} turn={turn} current={current} reveal={reveal} busy={busy}
    timerSec={timerSec} left={left}
    onGuess={submitGuess} onNext={scoreAndAdvance} onQuit={newGame} />;
}

// ---- Setup screen ----
function Setup(props) {
  return (
    <div className="max-w-md mx-auto px-5 py-8">
      <div className="text-center mb-7 rise">
        <div className="display text-6xl leading-none" style={{ color: 'var(--teal)' }}>DORA</div>
        <div className="display text-2xl mt-1 text-slate-200">Dead or Alive</div>
        <p className="text-slate-400 text-sm mt-3">Name a star. Guess living or gone.<br/>First to {WIN_SCORE} wins.</p>
      </div>

      <Section label="Players">
        <div className="space-y-2">
          {props.players.map(function(p, i) {
            return (
              <div key={i} className="flex items-center gap-2">
                <input value={p} onChange={function(e){ props.setPlayerName(i, e.target.value); }}
                  placeholder={'Player ' + (i + 1)} maxLength={16}
                  className="card flex-1 rounded-xl px-4 py-3 text-white placeholder-slate-500 outline-none focus:border-teal-400"
                  style={{ borderColor: 'var(--line)' }} />
                {props.players.length > 2 &&
                  <button onClick={function(){ props.removePlayer(i); }}
                    className="chip rounded-xl w-11 h-11 text-slate-400 text-xl">&times;</button>}
              </div>
            );
          })}
        </div>
        {props.players.length < 6 &&
          <button onClick={props.addPlayer}
            className="chip rounded-xl w-full py-2.5 mt-2 text-sm text-teal-200">+ Add player</button>}
      </Section>

      <Section label="Categories">
        <div className="grid grid-cols-2 gap-2">
          {CATEGORIES.map(function(c) {
            var on = props.cats.indexOf(c.id) !== -1;
            return (
              <button key={c.id} onClick={function(){ props.toggleCat(c.id); }}
                className={'chip rounded-xl py-3 text-sm font-semibold ' + (on ? 'chip-on' : 'text-slate-300')}>
                {c.label}
              </button>
            );
          })}
        </div>
      </Section>

      <Section label="Era">
        <div className="flex flex-wrap gap-2">
          {DECADES.map(function(d) {
            var on = props.decade === d;
            return (
              <button key={d} onClick={function(){ props.setDecade(d); }}
                className={'chip rounded-full px-4 py-2 text-sm font-semibold ' + (on ? 'chip-on' : 'text-slate-300')}>
                {d}
              </button>
            );
          })}
        </div>
      </Section>

      <Section label="Answer timer">
        <div className="flex gap-2">
          {[[0,'Off'],[15,'15s'],[30,'30s']].map(function(t) {
            var on = props.timerSec === t[0];
            return (
              <button key={t[0]} onClick={function(){ props.setTimerSec(t[0]); }}
                className={'chip rounded-xl flex-1 py-2.5 text-sm font-semibold ' + (on ? 'chip-on' : 'text-slate-300')}>
                {t[1]}
              </button>
            );
          })}
        </div>
      </Section>

      <button disabled={!props.canStart} onClick={props.onStart}
        className={'bigbtn display w-full rounded-2xl py-4 text-2xl mt-3 ' + (props.canStart ? 'text-slate-900' : 'text-slate-500')}
        style={{ background: props.canStart ? 'var(--teal)' : 'var(--panel)' }}>
        Start Game
      </button>
      {!props.canStart &&
        <p className="text-center text-slate-500 text-xs mt-2">Add at least 2 players and 1 category.</p>}
      <p className="text-center text-slate-700 text-xs mt-8">v{APP_VERSION} &middot; verified live from Wikipedia</p>
    </div>
  );
}

function Section(props) {
  return (
    <div className="mb-6">
      <div className="text-xs uppercase tracking-widest text-slate-500 mb-2 font-semibold">{props.label}</div>
      {props.children}
    </div>
  );
}

// ---- Play screen ----
function Play(props) {
  var s = props.scores || [];
  var cur = props.current;
  var rev = props.reveal;
  var me = s[props.turn] ? s[props.turn].name : '';

  return (
    <div className="max-w-md mx-auto px-5 py-6 min-h-screen flex flex-col">
      {/* scoreboard */}
      <div className="flex items-center gap-2 overflow-x-auto pb-1 mb-4">
        {s.map(function(p, i) {
          var active = i === props.turn;
          return (
            <div key={i}
              className={'card rounded-xl px-3 py-2 shrink-0 ' + (active ? '' : 'opacity-60')}
              style={ active ? { borderColor: 'var(--teal)' } : {} }>
              <div className="text-xs text-slate-300 max-w-[92px] truncate">{p.name}</div>
              <div className="display text-2xl tnum leading-none"
                style={{ color: active ? 'var(--teal)' : '#cbd5e1' }}>
                {p.score}<span className="text-slate-600 text-sm">/{WIN_SCORE}</span>
              </div>
            </div>
          );
        })}
        <button onClick={props.onQuit}
          className="chip rounded-xl px-3 py-2 shrink-0 text-slate-400 text-xs">Quit</button>
      </div>

      {/* main card */}
      <div className="flex-1 flex flex-col justify-center">
        {!rev && cur &&
          <div className="text-center rise">
            <div className="text-slate-400 text-sm mb-1">{me}, you&rsquo;re up</div>
            <div className="text-xs uppercase tracking-widest mb-6" style={{ color: 'var(--teal)' }}>
              {catLabel(cur.cat)} &middot; {cur.decade === 'Any' ? '' : cur.decade}
            </div>
            <div className="card rounded-3xl px-6 py-10 mb-2">
              <div className="display text-4xl leading-tight text-white">{cur.name}</div>
            </div>
            <div className="text-slate-500 text-sm mb-6">Dead or alive?</div>

            {props.timerSec > 0 && !props.busy &&
              <div className="flex justify-center mb-5">
                <TimerRing total={props.timerSec} left={props.left} />
              </div>}

            {props.busy
              ? <div className="text-slate-400 py-4">Checking Wikipedia&hellip;</div>
              : <div className="grid grid-cols-2 gap-3">
                  <button onClick={function(){ props.onGuess(true, false); }}
                    className="bigbtn display rounded-2xl py-6 text-2xl text-slate-900"
                    style={{ background: 'var(--alive)' }}>Alive</button>
                  <button onClick={function(){ props.onGuess(false, false); }}
                    className="bigbtn display rounded-2xl py-6 text-2xl text-white"
                    style={{ background: 'var(--dead)' }}>Dead</button>
                </div>}
          </div>}

        {rev && cur &&
          <Reveal name={cur.name} rev={rev} playerName={me} onNext={props.onNext} />}
      </div>
    </div>
  );
}

function catLabel(id) {
  for (var i = 0; i < CATEGORIES.length; i++) if (CATEGORIES[i].id === id) return CATEGORIES[i].label;
  return '';
}

function TimerRing(props) {
  var r = 18, c = 2 * Math.PI * r;
  var frac = props.total ? props.left / props.total : 0;
  var dash = c * frac;
  var col = props.left <= 5 ? 'var(--dead)' : 'var(--teal)';
  return (
    <div className="ringwrap">
      <svg width="44" height="44">
        <circle cx="22" cy="22" r={r} stroke="var(--line)" strokeWidth="4" fill="none" />
        <circle cx="22" cy="22" r={r} stroke={col} strokeWidth="4" fill="none"
          strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c - dash} />
      </svg>
      <div className="absolute inset-0 flex items-center justify-center tnum text-sm font-bold"
        style={{ color: col }}>{props.left}</div>
    </div>
  );
}

// ---- Reveal ----
function Reveal(props) {
  var rev = props.rev;
  var aliveTruth = rev.truthAlive;
  var verdictColor = aliveTruth ? 'var(--alive)' : 'var(--dead)';
  var verdictText = aliveTruth ? 'Still with us' : ('Died ' + (rev.year ? rev.year : '\u2014'));
  var outcome, outcomeColor;
  if (rev.timedOut) { outcome = 'Time\u2019s up'; outcomeColor = 'var(--dead)'; }
  else if (rev.correct) { outcome = 'Correct'; outcomeColor = 'var(--alive)'; }
  else { outcome = 'Wrong'; outcomeColor = 'var(--dead)'; }

  return (
    <div className="text-center">
      <div className="card rounded-3xl px-6 py-9 mb-4">
        <div className="text-slate-400 text-sm mb-3">{props.name}</div>
        <div className="stamp inline-block display text-4xl px-5 py-2 rounded-xl"
          style={{ color: verdictColor, border: '3px solid ' + verdictColor }}>
          {verdictText}
        </div>
        {rev.unknown &&
          <div className="text-slate-500 text-xs mt-4">Wikipedia didn&rsquo;t confirm &mdash; using our best record.</div>}
      </div>

      <div className="display text-3xl mb-1" style={{ color: outcomeColor }}>{outcome}</div>
      <div className="text-slate-400 text-sm mb-7">
        {rev.timedOut ? props.playerName + ' ran out of time' :
          (rev.correct ? props.playerName + ' scores a point' : 'No point for ' + props.playerName)}
      </div>

      <button onClick={props.onNext}
        className="bigbtn display w-full rounded-2xl py-4 text-2xl text-slate-900"
        style={{ background: 'var(--teal)' }}>Next</button>
    </div>
  );
}

// ---- Win ----
function Win(props) {
  var sorted = props.scores.slice().sort(function(a, b) { return b.score - a.score; });
  return (
    <div className="max-w-md mx-auto px-5 py-10 min-h-screen flex flex-col justify-center">
      <div className="text-center rise">
        <div className="text-xs uppercase tracking-widest text-slate-500 mb-2">Winner</div>
        <div className="display text-6xl leading-none mb-2" style={{ color: 'var(--teal)' }}>
          {props.winnerName}
        </div>
        <div className="text-slate-400 mb-8">reached {WIN_SCORE} first</div>

        <div className="card rounded-2xl divide-y" style={{ borderColor: 'var(--line)' }}>
          {sorted.map(function(p, i) {
            return (
              <div key={i} className="flex items-center justify-between px-5 py-3"
                style={{ borderColor: 'var(--line)' }}>
                <span className="text-slate-200">{p.name}</span>
                <span className="display text-2xl tnum" style={{ color: i === 0 ? 'var(--teal)' : '#94a3b8' }}>
                  {p.score}
                </span>
              </div>
            );
          })}
        </div>

        <button onClick={props.onAgain}
          className="bigbtn display w-full rounded-2xl py-4 text-2xl text-slate-900 mt-6"
          style={{ background: 'var(--teal)' }}>Play again</button>
        <button onClick={props.onNew}
          className="chip rounded-2xl w-full py-3 mt-3 text-slate-300">New game &amp; settings</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
