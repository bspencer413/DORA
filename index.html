  @keyframes blink { 0%,60%,100% { opacity: 1; } 70%,88% { opacity: 0.25; } }
  .ringwrap { position: relative; width: 46px; height: 46px; }
  .ringwrap svg { transform: rotate(-90deg); }
  @media (prefers-reduced-motion: reduce) { .slam,.rise,.flash,.pop,.flick,.flick2,.blink { animation: none; } }
  input { font-family: inherit; }

var useState = React.useState, useEffect = React.useEffect, useRef = React.useRef;

// NAME POOL — [name, decade, aliveFallback, wikiTitle?]. Wikipedia is truth at play time. Expand by adding lines.

    ['Whitney Houston','80s',false], ['Michael Jackson','80s',false], ['Barbra Streisand','60s',true],
    ['Ray Charles','50s',false], ['Nat King Cole','50s',false], ['Dolly Parton','70s',true],
    ['Willie Nelson','70s',true], ['Johnny Cash','60s',false], ['Cher','70s',true],

    ['Diego Maradona','80s',false], ['Bo Jackson','80s',true], ['John Madden','70s',false],

  ],
  politics: [
    ['Jimmy Carter','70s',false], ['Bill Clinton','90s',true], ['George W. Bush','00s',true],
    ['Barack Obama','00s',true], ['Ronald Reagan','80s',false], ['Richard Nixon','70s',false],
    ['Gerald Ford','70s',false], ['Margaret Thatcher','80s',false], ['Nelson Mandela','90s',false],
    ['Mikhail Gorbachev','80s',false], ['Henry Kissinger','70s',false], ['Colin Powell','90s',false],
    ['John McCain','00s',false], ['Ted Kennedy','70s',false], ['George H. W. Bush','90s',false],

    ['Al Gore','90s',true], ['Newt Gingrich','90s',true], ['Madeleine Albright','90s',false],
    ['Tony Blair','90s',true], ['Angela Merkel','00s',true], ['Fidel Castro','60s',false],
    ['Yasser Arafat','70s',false], ['Boris Yeltsin','90s',false], ['Dick Cheney','00s',true],
    ['Jesse Jackson','80s',true], ['Bob Dole','90s',false]
  ],
  authors: [
    ['Ken Kesey','60s',false], ['Hunter S. Thompson','70s',false], ['Robert A. Heinlein','50s',false],
    ['Ernest Hemingway','50s',false], ['Maya Angelou','70s',false], ['Toni Morrison','80s',false],
    ['Kurt Vonnegut','60s',false], ['Ray Bradbury','50s',false], ['Isaac Asimov','50s',false],
    ['Philip K. Dick','60s',false], ['Harper Lee','60s',false], ['Truman Capote','60s',false],
    ['Gore Vidal','70s',false], ['Michael Crichton','90s',false], ['Ursula K. Le Guin','70s',false],
    ['Tom Wolfe','80s',false], ['Terry Pratchett','90s',false], ['Cormac McCarthy','00s',false],
    ['Stephen King','80s',true], ['Margaret Atwood','80s',true], ['J. K. Rowling','90s',true],
    ['Salman Rushdie','80s',true], ['Neil Gaiman','90s',true], ['George R. R. Martin','90s',true],
    ['Joyce Carol Oates','70s',true], ['Don DeLillo','80s',true], ['Thomas Pynchon','70s',true],
    ['William Gibson','80s',true]
  ]
};
var CATEGORIES = [
  { id:'actors', label:'Actors' }, { id:'performers', label:'Performers' },
  { id:'athletes', label:'Athletes' }, { id:'politics', label:'Politicians' },
  { id:'authors', label:'Authors' }, { id:'random', label:'Random' }
];
var DECADES = ['Any','40s','50s','60s','70s','80s','90s','00s'];
var WIN_SCORE = 7;

function buildFlat(){
  var out=[];
  for (var cat in POOL){ if(!POOL.hasOwnProperty(cat)) continue; var arr=POOL[cat];
    for (var i=0;i<arr.length;i++){ var e=arr[i];
      out.push({ name:e[0], decade:e[1], aliveFallback:e[2], title:e[3]?e[3]:e[0], cat:cat }); } }
  return out;
}
var ALL = buildFlat();
function poolFor(sel, decade, used){
  var wantRandom = sel.indexOf('random')!==-1;
  return ALL.filter(function(p){
    if (used[p.title]) return false;
    if (decade!=='Any' && p.decade!==decade) return false;
    if (wantRandom) return true;
    return sel.indexOf(p.cat)!==-1;
  });
}
function pickRandom(list){ if(!list.length) return null; return list[Math.floor(Math.random()*list.length)]; }
function catLabel(id){ for(var i=0;i<CATEGORIES.length;i++) if(CATEGORIES[i].id===id) return CATEGORIES[i].label; return ''; }

function verifyAlive(title){
  var url='https://en.wikipedia.org/w/api.php?action=query&prop=categories&cllimit=500&clshow=!hidden&redirects=1&format=json&origin=*&titles='+encodeURIComponent(title);
  return fetch(url).then(function(r){return r.json();}).then(function(data){
    var cats=[];
    try{ var pages=data.query.pages; for(var k in pages) if(pages.hasOwnProperty(k)&&pages[k].categories) cats=pages[k].categories.map(function(c){return c.title;}); }catch(e){cats=[];}
    var living=false, year=null;
    for(var i=0;i<cats.length;i++){ if(cats[i].indexOf('Living people')!==-1) living=true; var m=cats[i].match(/Category:(\d{4}) deaths/); if(m) year=m[1]; }
    if(year) return {alive:false, year:year};
    if(living) return {alive:true, year:null};
    return {alive:null, year:null};
  }).catch(function(){ return {alive:null, year:null}; });
}

function App(){
  var sc=useState('splash'), screen=sc[0], setScreen=sc[1];
  var pl=useState(['','']), players=pl[0], setPlayers=pl[1];
  var ct=useState(['actors','performers','athletes','politics','authors']), cats=ct[0], setCats=ct[1];
  var dc=useState('Any'), decade=dc[0], setDecade=dc[1];
  var tm=useState(0), timerSec=tm[0], setTimerSec=tm[1];
  var scS=useState([]), scores=scS[0], setScores=scS[1];
  var tn=useState(0), turn=tn[0], setTurn=tn[1];
  var us=useState({}), used=us[0], setUsed=us[1];
  var cu=useState(null), current=cu[0], setCurrent=cu[1];
  var rv=useState(null), reveal=rv[0], setReveal=rv[1];
  var bs=useState(false), busy=bs[0], setBusy=bs[1];
  var wnr=useState(-1), winner=wnr[0], setWinner=wnr[1];
  var lf=useState(0), left=lf[0], setLeft=lf[1];
  var tickRef=useRef(null);

  var validPlayers=players.filter(function(p){return p.trim().length>0;});
  var canStart=validPlayers.length>=2 && cats.length>=1;

  function toggleCat(id){ if(cats.indexOf(id)!==-1) setCats(cats.filter(function(c){return c!==id;})); else setCats(cats.concat([id])); }
  function setPlayerName(i,v){ var n=players.slice(); n[i]=v; setPlayers(n); }
  function addPlayer(){ if(players.length<6) setPlayers(players.concat([''])); }
  function removePlayer(i){ if(players.length>2) setPlayers(players.filter(function(_,idx){return idx!==i;})); }

  function startGame(){ var s=validPlayers.map(function(n){return {name:n.trim(),score:0};});
    setScores(s); setTurn(0); setUsed({}); setCurrent(null); setReveal(null); setWinner(-1); setScreen('play'); serveNext(0,{}); }
  function serveNext(nextTurn, usedMap){
    var pool=poolFor(cats, decade, usedMap);
    if(!pool.length){ usedMap={}; pool=poolFor(cats, decade, usedMap); setUsed({}); }
    setCurrent(pickRandom(pool)); setReveal(null); setTurn(nextTurn); startTimer();
  }
  function startTimer(){ clearTimer(); if(!timerSec){ setLeft(0); return; } setLeft(timerSec); }
  function clearTimer(){ if(tickRef.current){ clearInterval(tickRef.current); tickRef.current=null; } }

  useEffect(function(){
    if(screen!=='play'||!timerSec||reveal||busy||!current){ clearTimer(); return; }
    clearTimer();
    tickRef.current=setInterval(function(){ setLeft(function(prev){ if(prev<=1){ clearTimer(); submitGuess(null,true); return 0; } return prev-1; }); },1000);
    return clearTimer;
  },[screen,timerSec,reveal,busy,current]);

  function submitGuess(guessAlive, timedOut){
    if(busy||reveal||!current) return;
    setBusy(true); clearTimer();
    verifyAlive(current.title).then(function(res){
      var truthAlive=res.alive, unknown=false;
      if(truthAlive===null){ truthAlive=current.aliveFallback; unknown=true; }
      var correct=false;
      if(!timedOut && guessAlive!==null) correct=(guessAlive===truthAlive);
      setReveal({ guess:guessAlive, truthAlive:truthAlive, year:res.year, correct:correct, timedOut:!!timedOut, unknown:unknown });
      setBusy(false);
    });
  }
  function scoreAndAdvance(){
    var newScores=scores.map(function(s,i){ if(i===turn&&reveal&&reveal.correct) return Object.assign({},s,{score:s.score+1}); return s; });
    setScores(newScores);
    var used2=Object.assign({},used); if(current) used2[current.title]=true; setUsed(used2);
    if(reveal&&reveal.correct&&newScores[turn].score>=WIN_SCORE){ setWinner(turn); setScreen('win'); setReveal(null); return; }
    serveNext((turn+1)%scores.length, used2);
  }
  function newGame(){ setScreen('setup'); setReveal(null); setCurrent(null); setWinner(-1); }
  function playAgain(){ var s=scores.map(function(x){return {name:x.name,score:0};}); setScores(s); setUsed({}); setWinner(-1); setScreen('play'); serveNext(0,{}); }

  if(screen==='splash') return <Splash onPlay={function(){ setScreen('setup'); }} />;
  if(screen==='setup') return <Setup players={players} setPlayerName={setPlayerName} addPlayer={addPlayer} removePlayer={removePlayer}
    cats={cats} toggleCat={toggleCat} decade={decade} setDecade={setDecade} timerSec={timerSec} setTimerSec={setTimerSec} canStart={canStart} onStart={startGame} onBack={function(){setScreen('splash');}} />;
  if(screen==='win') return <Win winnerName={scores[winner]?scores[winner].name:''} scores={scores} onAgain={playAgain} onNew={newGame} />;
  return <Play scores={scores} turn={turn} current={current} reveal={reveal} busy={busy} timerSec={timerSec} left={left}
    onGuess={submitGuess} onNext={scoreAndAdvance} onQuit={newGame} />;
}

// ---- Splash: full-screen neon-sign wanted poster (WANTED is the hero) ----
function Splash(props){
  return (
    <div className="w-full px-4" style={{minHeight:'100dvh', paddingTop:'max(1rem, env(safe-area-inset-top))', paddingBottom:'max(1rem, env(safe-area-inset-bottom))'}}>
      <div className="neon-frame rise flex flex-col px-5" style={{minHeight:'calc(100dvh - 2rem)'}}>
        {/* brand tag */}
        <div className="flex items-center justify-center gap-3 pt-7">
          <span className="display text-4xl neon-teal">DORA</span>
          <span className="t2 text-lg tracking-[0.28em]">THE PARTY GAME</span>
        </div>

        {/* HERO — fills the middle */}
        <div className="flex-1 flex flex-col items-center justify-center text-center">
          <div className="t2 text-lg tracking-[0.4em] mb-5 flick2">&#9733;&nbsp; REWARD : BRAGGING RIGHTS &nbsp;&#9733;</div>

          <div className="display flick neon-pink leading-[0.9]" style={{fontSize:'clamp(80px, 27vw, 210px)'}}>Wanted</div>

          <div className="my-5 w-full flex items-center justify-center gap-3 max-w-xs mx-auto">
            <span className="h-px flex-1" style={{background:'linear-gradient(90deg,transparent,var(--line-2))'}}></span>
            <span className="t2 text-lg tracking-[0.32em]">DEAD OR ALIVE</span>
            <span className="h-px flex-1" style={{background:'linear-gradient(90deg,var(--line-2),transparent)'}}></span>
          </div>

          <div className="display blink leading-[0.85]">
            <span className="neon-alive" style={{fontSize:'clamp(52px, 17vw, 128px)'}}>Dead</span>
            <span className="t3 mx-3" style={{fontSize:'clamp(24px, 7vw, 56px)'}}>or</span>
            <span className="neon-dead" style={{fontSize:'clamp(52px, 17vw, 128px)'}}>Alive</span>
          </div>

          <p className="t2 text-xl mt-9 max-w-sm leading-relaxed">A legend drops. You call it &mdash; still standing, or long gone.<br/><span className="t3">First to {WIN_SCORE} wins.</span></p>
        </div>

        {/* bottom action — neon outline */}
        <div className="pb-6">
          <button onClick={props.onPlay} className="btn-neon display w-full rounded-2xl py-5 neon-teal" style={{fontSize:'clamp(34px, 10vw, 52px)'}}>Play</button>
          <p className="text-center t3 text-xs mt-4">v{APP_VERSION} &middot; verified live from Wikipedia</p>
        </div>
      </div>
    </div>
  );
}

function Setup(props){
  return (
    <div className="max-w-md mx-auto px-5 py-6" style={{paddingTop:'max(1.5rem, env(safe-area-inset-top))'}}>
      <div className="text-center mb-6 rise">
        <span className="display text-3xl neon-teal">DORA</span>
      </div>
      <Section label="Players" hint="add up to 6">
        <div className="space-y-2">
          {props.players.map(function(p,i){ return (
            <div key={i} className="flex items-center gap-2">
              <input value={p} onChange={function(e){props.setPlayerName(i,e.target.value);}} placeholder={'Player '+(i+1)} maxLength={16}
                className="panel flex-1 rounded-xl px-4 py-3 text-white placeholder-slate-500 outline-none"
                onFocus={function(e){e.target.style.borderColor='var(--teal)';}} onBlur={function(e){e.target.style.borderColor='var(--line)';}} />
              {props.players.length>2 && <button onClick={function(){props.removePlayer(i);}} className="chip rounded-xl w-11 h-11 text-xl">&times;</button>}
            </div>
          );})}
        </div>
        {props.players.length<6 && <button onClick={props.addPlayer} className="chip rounded-xl w-full py-2.5 mt-2 text-sm" style={{color:'var(--teal)'}}>+ Add player</button>}
      </Section>
      <Section label="Categories" hint="pick one or more">
        <div className="grid grid-cols-2 gap-2">
          {CATEGORIES.map(function(c){ var on=props.cats.indexOf(c.id)!==-1; return (
            <button key={c.id} onClick={function(){props.toggleCat(c.id);}} className={'chip rounded-xl py-3 text-sm font-semibold '+(on?'chip-on':'')}>{c.label}</button>
          );})}
        </div>
      </Section>
      <Section label="Era" hint="pick one">
        <div className="flex flex-wrap gap-2">
          {DECADES.map(function(d){ var on=props.decade===d; return (
            <button key={d} onClick={function(){props.setDecade(d);}} className={'chip rounded-full px-4 py-2 text-sm font-semibold '+(on?'chip-on':'')}>{d}</button>
          );})}
        </div>
      </Section>
      <Section label="Answer timer" hint="optional">
        <div className="flex gap-2">
          {[[0,'Off'],[15,'15s'],[30,'30s']].map(function(t){ var on=props.timerSec===t[0]; return (
            <button key={t[0]} onClick={function(){props.setTimerSec(t[0]);}} className={'chip rounded-xl flex-1 py-2.5 text-sm font-semibold '+(on?'chip-on':'')}>{t[1]}</button>
          );})}
        </div>
      </Section>
      <button disabled={!props.canStart} onClick={props.onStart} className={'btn display w-full rounded-2xl py-4 text-3xl mt-3 '+(props.canStart?'glow-teal':'')}
        style={{ background:props.canStart?'var(--teal)':'var(--panel)', color:props.canStart?'#061a15':'#4a5a70' }}>Start</button>
      {!props.canStart && <p className="text-center t3 text-xs mt-2">Add 2+ players and a category.</p>}
    </div>
  );
}
function Section(props){ return (
  <div className="mb-6">
    <div className="text-xs uppercase tracking-[0.2em] t3 mb-2 font-semibold">
      {props.label}{props.hint && <span className="t3 opacity-70"> &mdash; {props.hint}</span>}
    </div>
    {props.children}
  </div>
); }

function Play(props){
  var s=props.scores||[], cur=props.current, rev=props.reveal;
  var me=s[props.turn]?s[props.turn].name:'';
  return (
    <div className="max-w-md mx-auto px-5 py-6 flex flex-col" style={{minHeight:'100dvh', paddingTop:'max(1.5rem, env(safe-area-inset-top))'}}>
      <div className="flex items-center gap-2.5 overflow-x-auto pb-1 mb-2">
        {s.map(function(p,i){ var active=i===props.turn; return (
          <div key={i} className={'panel rounded-xl px-4 py-3 shrink-0 '+(active?'glow-teal':'opacity-60')} style={active?{borderColor:'var(--teal)'}:{}}>
            <div className="text-sm t2 max-w-[104px] truncate">{p.name}</div>
            <div className="display text-3xl tnum leading-none" style={{color:active?'var(--teal)':'#c3cede'}}>{p.score}<span className="t3 text-base">/{WIN_SCORE}</span></div>
          </div>
        );})}
      </div>
      <div className="flex-1 flex flex-col justify-center">
        {!rev && cur &&
          <div className="text-center">
            <div className="t2 text-xl mb-2 rise">{me}, your call</div>
            <div className="text-sm uppercase tracking-[0.25em] mb-8 rise neon-teal">{catLabel(cur.cat)}{cur.decade==='Any'?'':' \u00b7 '+cur.decade}</div>
            <div className="pop panel rounded-3xl px-6 py-14 mb-3" style={{background:'linear-gradient(180deg, #161d2c, #0b1018)'}}>
              <div className="display text-6xl leading-tight text-white">{cur.name}</div>
            </div>
            <div className="t3 text-sm mb-7">Dead or alive?</div>
            {props.timerSec>0 && !props.busy && <div className="flex justify-center mb-6"><TimerRing total={props.timerSec} left={props.left} /></div>}
            {props.busy
              ? <div className="t2 py-5 rise">Checking the record&hellip;</div>
              : <div className="grid grid-cols-2 gap-3">
                  <button onClick={function(){props.onGuess(false,false);}} className="btn display rounded-2xl py-8 text-4xl glow-dead" style={{background:'var(--dead)', color:'#fff'}}>Dead</button>
                  <button onClick={function(){props.onGuess(true,false);}} className="btn display rounded-2xl py-8 text-4xl glow-alive" style={{background:'var(--alive)', color:'#03150e'}}>Alive</button>
                </div>}
          </div>}
        {rev && cur && <Reveal name={cur.name} rev={rev} playerName={me} onNext={props.onNext} />}
      </div>
      <div className="text-center pt-4 pb-2">
        <button onClick={props.onQuit} className="chip rounded-xl px-4 py-2 text-xs">Quit</button>
      </div>
    </div>
  );
}
function TimerRing(props){
  var r=19, c=2*Math.PI*r, frac=props.total?props.left/props.total:0, dash=c*frac;
  var col=props.left<=5?'var(--dead)':'var(--teal)';
  return (
    <div className="ringwrap">
      <svg width="46" height="46">
        <circle cx="23" cy="23" r={r} stroke="var(--line)" strokeWidth="4" fill="none" />
        <circle cx="23" cy="23" r={r} stroke={col} strokeWidth="4" fill="none" strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c-dash} />
      </svg>
      <div className="absolute inset-0 flex items-center justify-center tnum text-sm font-bold" style={{color:col}}>{props.left}</div>
    </div>
  );
}
function Reveal(props){
  var rev=props.rev, alive=rev.truthAlive;
  var neon=alive?'neon-alive':'neon-dead', flashCol=alive?'var(--alive)':'var(--dead)', verdict=alive?'Alive':'Dead';
  var sub=alive?'Still standing':(rev.year?('Died '+rev.year):'Gone');
  var outcome, oNeon;
  if(rev.timedOut){ outcome='Time\u2019s up'; oNeon='neon-dead'; }
  else if(rev.correct){ outcome='Nailed it'; oNeon='neon-alive'; }
  else { outcome='Missed'; oNeon='neon-dead'; }
  return (
    <div className="text-center">
      <div className="relative panel rounded-3xl px-6 py-14 mb-5 overflow-hidden">
        <div className="flash absolute inset-0" style={{background:flashCol}}></div>
        <div className="relative">
          <div className="t2 text-sm mb-4">{props.name}</div>
          <div className={'slam display leading-none '+neon} style={{fontSize:'clamp(72px, 24vw, 150px)'}}>{verdict}</div>
          <div className="t2 text-lg mt-3">{sub}</div>
          {rev.unknown && <div className="t3 text-xs mt-3">Wikipedia didn&rsquo;t confirm &mdash; using our record.</div>}
        </div>
      </div>
      <div className={'display text-4xl mb-1 '+oNeon}>{outcome}</div>
      <div className="t2 text-sm mb-7">{rev.timedOut?props.playerName+' ran out the clock':(rev.correct?'+1 for '+props.playerName:'No point for '+props.playerName)}</div>
      <button onClick={props.onNext} className="btn display w-full rounded-2xl py-4 text-2xl glow-teal" style={{background:'var(--teal)', color:'#061a15'}}>Next</button>
    </div>
  );
}
function Win(props){
  var sorted=props.scores.slice().sort(function(a,b){return b.score-a.score;});
  return (
    <div className="max-w-md mx-auto px-5 py-10 flex flex-col justify-center" style={{minHeight:'100dvh'}}>
      <div className="text-center rise">
        <div className="t3 text-xs uppercase tracking-[0.3em] mb-3">Winner</div>
        <div className="slam display leading-none mb-1 neon-teal" style={{fontSize:'clamp(56px, 18vw, 120px)'}}>{props.winnerName}</div>
        <div className="display text-5xl neon-pink mb-8">wins!</div>
        <div className="panel rounded-2xl divide-y" style={{borderColor:'var(--line)'}}>
          {sorted.map(function(p,i){ return (
            <div key={i} className="flex items-center justify-between px-5 py-3" style={{borderColor:'var(--line)'}}>
              <span className="t2">{p.name}</span>
              <span className="display text-2xl tnum" style={{color:i===0?'var(--teal)':'#8595ad'}}>{p.score}</span>
            </div>
          );})}
        </div>
        <button onClick={props.onAgain} className="btn display w-full rounded-2xl py-4 text-2xl glow-teal mt-6" style={{background:'var(--teal)', color:'#061a15'}}>Play again</button>
        <button onClick={props.onNew} className="chip rounded-2xl w-full py-3 mt-3">New game &amp; settings</button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
